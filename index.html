<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clash Clan Tracker</title>
<style>
  body { background: #0B1220; color: #F1F4FA; font-family: Arial, sans-serif; padding: 20px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  .panel { background: #151F35; border: 1px solid #263454; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
  h1 { color: #E8B44A; }
  select, button { padding: 8px; background: #1C2A45; color: #fff; border: 1px solid #263454; border-radius: 5px; width: 100%; margin-bottom: 5px; }
  button { background: #E8B44A; color: #000; font-weight: bold; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border-bottom: 1px solid #263454; padding: 8px; text-align: left; }
  .empty { color: #8C97B3; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ Clash Tracker</h1>
  
  <div class="panel">
    <label>Conectar:</label>
    <select id="clanSelect"><option value="">Carregando clãs...</option></select>
    <button onclick="connect()">Conectar</button>
  </div>

  <div class="panel">
    <h3>Ataques</h3>
    <div id="attackTableWrap"><div class="empty">Aguardando dados...</div></div>
  </div>

  <div class="panel">
    <h3>Promoções</h3>
    <div id="promoTableWrap"><div class="empty">Aguardando dados...</div></div>
  </div>
</div>

<script>
const API = 'https://clash-tracker-six.vercel.app';

async function connect() {
  const select = document.getElementById('clanSelect');
  try {
    // 1. Carrega lista de clãs
    if (select.options.length === 1) {
      const res = await fetch(API + '/api/clans');
      const clans = await res.json();
      select.innerHTML = '<option value="">Selecione um clã</option>' + clans.map(c => `<option value="${c.tag}">${c.name}</option>`).join('');
      if (clans.length > 0) { select.value = clans[0].tag; loadClan(select.value); }
      select.onchange = () => loadClan(select.value);
    }
  } catch (e) { alert('Erro ao conectar: ' + e.message); }
}

async function loadClan(tag) {
  if (!tag) return;
  document.getElementById('attackTableWrap').innerHTML = '<div class="empty">Carregando...</div>';
  document.getElementById('promoTableWrap').innerHTML = '<div class="empty">Carregando...</div>';

  try {
    // Só tenta carregar se demorar menos de 5 segundos
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 5000);

    const [war, promo] = await Promise.all([
      fetch(API + '/api/war-days/' + encodeURIComponent(tag), { signal: controller.signal }).then(r => r.json()),
      fetch(API + '/api/promotions/' + encodeURIComponent(tag), { signal: controller.signal }).then(r => r.json())
    ]);

    // Renderizar Guerra (simplificado)
    if (war.length === 0) {
      document.getElementById('attackTableWrap').innerHTML = '<div class="empty">Nenhuma guerra encontrada.</div>';
    } else {
      let html = '<table><tr><th>Membro</th><th>Ataques</th></tr>';
      war.slice(0, 50).forEach(w => {
        html += `<tr><td>${w.member_name}</td><td>${w.decks_used || 0}/4</td></tr>`;
      });
      html += '</table>';
      document.getElementById('attackTableWrap').innerHTML = html;
    }

    // Renderizar Promoções (simplificado)
    if (promo.length === 0) {
      document.getElementById('promoTableWrap').innerHTML = '<div class="empty">Nenhuma promoção encontrada.</div>';
    } else {
      let html = '<table><tr><th>Membro</th><th>Cargo</th><th>Média</th></tr>';
      promo.slice(0, 50).forEach(p => {
        html += `<tr><td>${p.member_name}</td><td>${p.member_rank}</td><td>${Math.round(p.avg_4w || 0)}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('promoTableWrap').innerHTML = html;
    }

  } catch (err) {
    document.getElementById('attackTableWrap').innerHTML = `<div class="empty">⏳ Vercel demorou, tente novamente.</div>`;
  }
}

connect();
</script>
</body>
</html>
